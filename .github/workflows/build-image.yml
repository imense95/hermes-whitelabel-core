name: build-image

# Push na main constroi e publica a imagem. NAO faz deploy em cliente:
# promocao e' acao explicita, por cliente, no EasyPanel. Um bug que sobe
# para 20 instancias de uma vez e' um incidente com 20 clientes.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE: ${{ github.repository_owner }}/hermes-whitelabel
  # Tag do upstream FIXADA; nunca :latest. As tags reais do Docker Hub tem
  # prefixo "v" (v2026.9.21) — sem o "v" o build falha com "not found".
  HERMES_TAG: "v2026.9.21"

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: instalar dependencias
        run: |
          pip install -r admin-api/requirements.txt \
                      -r easypanel-proxy/requirements.txt \
                      -r release-engine/requirements.txt pytest pytest-asyncio
      - name: testes da Admin API
        working-directory: admin-api
        run: python -m pytest tests/ -q
      - name: testes do EasyPanel Proxy
        working-directory: easypanel-proxy
        run: python -m pytest tests/ -q
      - name: testes do Release Engine
        working-directory: release-engine
        run: python -m pytest tests/ -q
      - name: sintaxe dos scripts
        run: |
          for f in scripts/*.sh infra/scripts/*.sh easypanel-proxy/scripts/*.sh image/s6/*/run; do
            bash -n "$f" && echo "ok: $f"
          done
      # Buraco fechado: o SQL nunca era validado — um erro de sintaxe num
      # init/ so aparecia no boot do Postgres em producao. pglast usa o parser
      # NATIVO do Postgres (libpg_query), entao pega o que um regex nao pega.
      # So os init/*.sql sao SQL puro do servidor. Os verificar-*.sql sao
      # scripts de PSQL (tem meta-comandos \set/\echo que o parser do servidor
      # nao conhece de proposito) — esses sao validados de outra forma abaixo.
      - name: sintaxe do SQL (parser nativo do Postgres)
        run: |
          pip install pglast
          python - <<'PY'
          import glob, sys, pglast
          erros = 0
          arquivos = sorted(glob.glob("infra/db/init/*.sql"))
          for f in arquivos:
              try:
                  n = len(pglast.parse_sql(open(f, encoding="utf-8").read()))
                  print(f"ok ({n} stmts): {f}")
              except pglast.parser.ParseError as e:
                  print(f"::error file={f}::{e}")
                  erros += 1
          print(f"\n{len(arquivos)} init/*.sql, {erros} com erro de sintaxe")
          sys.exit(1 if erros else 0)
          PY
      # Scripts de psql (verificar-*.sql): removem os meta-comandos de cliente
      # (\set, \echo, \gset) e parseiam o SQL do servidor que sobra.
      - name: sintaxe dos scripts de psql
        run: |
          python - <<'PY'
          import glob, re, sys, pglast
          erros = 0
          for f in sorted(glob.glob("infra/db/verificar-*.sql")):
              corpo = "\n".join(
                  "" if re.match(r"\s*\\", ln) else ln
                  for ln in open(f, encoding="utf-8").read().splitlines()
              )
              try:
                  pglast.parse_sql(corpo)
                  print(f"ok: {f}")
              except pglast.parser.ParseError as e:
                  print(f"::error file={f}::{e}")
                  erros += 1
          sys.exit(1 if erros else 0)
          PY

  # Buraco fechado: o client-ui (front-end do cliente) nunca era buildado no CI
  # — um bundle quebrado passava verde e so falhava ao assar a imagem (ou pior,
  # em producao). Agora o build de producao roda em todo push/PR.
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: client-ui/package-lock.json
      - name: instalar dependencias
        working-directory: client-ui
        run: npm ci
      - name: build de producao
        working-directory: client-ui
        run: npm run build
      - name: dist gerado?
        working-directory: client-ui
        run: test -f dist/index.html && echo "dist/index.html ok" || { echo "::error::build nao gerou dist/index.html"; exit 1; }

  # Buraco fechado (parte 2): ate aqui o SQL so era PARSEADO (pglast). Agora
  # ele e' APLICADO DE VERDADE num Postgres 16 real — pega erro semantico que
  # o parser nao ve: coluna/tipo/constraint que nao casa, grant em objeto
  # inexistente, ordem de dependencia. E roda os testes do RepoPostgres contra
  # esse banco, provando que o codigo Python casa com o schema.
  sql-real:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: testpw
          POSTGRES_DB: plataforma
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGPASSWORD: testpw
      RELEASE_TEST_DSN: postgresql://postgres:testpw@localhost:5432/plataforma
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: cliente do Postgres
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client
      - name: pre-requisitos (schema + role que os init assumem)
        run: |
          psql -h localhost -U postgres -d plataforma -v ON_ERROR_STOP=1 <<'SQL'
          CREATE SCHEMA IF NOT EXISTS platform;
          DO $$ BEGIN
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname='platform_panel') THEN
              CREATE ROLE platform_panel;
            END IF;
          END $$;
          SQL
      - name: aplicar os init do painel de verdade (04 + 05, em ordem)
        run: |
          for f in 04-skills-registry-prod.sql 05-release-engine-prod.sql; do
            echo "=== aplicando $f ==="
            psql -h localhost -U postgres -d plataforma -v ON_ERROR_STOP=1 \
                 -f "infra/db/init/$f"
          done
      - name: idempotencia (aplicar 04+05 de novo nao quebra)
        run: |
          for f in 04-skills-registry-prod.sql 05-release-engine-prod.sql; do
            psql -h localhost -U postgres -d plataforma -v ON_ERROR_STOP=1 \
                 -f "infra/db/init/$f"
          done
      - name: as tabelas existem?
        run: |
          psql -h localhost -U postgres -d plataforma -c "\dt platform.*" \
            | grep -q "release" || { echo "::error::platform.release nao criada"; exit 1; }
      - name: testes do RepoPostgres contra o banco real
        working-directory: release-engine
        run: |
          pip install -r requirements.txt pytest
          python -m pytest tests/test_repo_postgres.py -v

  imagem:
    needs: [testes, frontend, sql-real]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # O catalogo e' repo privado separado: o GITHUB_TOKEN desta execucao NAO
      # alcanca outro repositorio.
      #
      # Usamos DEPLOY KEY (ssh-key), nao PAT. Uma deploy key read-only e'
      # escopada a UM repositorio e nao carrega a identidade de ninguem: se
      # vazar, da leitura do catalogo e nada mais. Um PAT, mesmo
      # fine-grained, e' credencial de usuario e expira — dia em que expira,
      # o build passa a sair sem skills silenciosamente.
      - name: o catalogo esta acessivel?
        id: catalogo
        run: |
          if [ -n "${{ secrets.CATALOG_DEPLOY_KEY }}" ]; then
            echo "tem=true" >> "$GITHUB_OUTPUT"
          else
            echo "tem=false" >> "$GITHUB_OUTPUT"
            echo "::warning::CATALOG_DEPLOY_KEY ausente — imagem sai sem as skills do produto."
          fi

      - name: trazer o catalogo de skills
        if: steps.catalogo.outputs.tem == 'true'
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/hermes-whitelabel-catalog
          ssh-key: ${{ secrets.CATALOG_DEPLOY_KEY }}
          path: product

      # Catálogo vazio com a chave presente = algo quebrou no checkout.
      # Falhar aqui e' melhor que publicar imagem sem skills achando que tem.
      - name: o catalogo veio mesmo?
        if: steps.catalogo.outputs.tem == 'true'
        run: |
          for d in skills plugins skins config; do
            test -d "product/$d" || { echo "::error::product/$d ausente apos checkout"; exit 1; }
          done
          echo "catalogo ok: $(find product -type f | wc -l) arquivos"

      # O Dockerfile faz COPY dos quatro diretorios: todos precisam existir.
      - name: catalogo vazio (sem token)
        if: steps.catalogo.outputs.tem != 'true'
        run: mkdir -p product/skills product/plugins product/skins product/config

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=staging,enable={{is_default_branch}}
            type=semver,pattern=v{{version}}
          # NAO ha tag :stable aqui de proposito: stable e' promocao manual,
          # depois da verificacao em staging.

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: image/Dockerfile
          build-args: HERMES_TAG=${{ env.HERMES_TAG }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: resumo
        run: |
          echo "### Imagem publicada" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.meta.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "Deploy automatico so em staging. Para promover um cliente:" >> $GITHUB_STEP_SUMMARY
          echo "marque a imagem como :stable e atualize o servico dele no EasyPanel." >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.catalogo.outputs.tem }}" != "true" ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "> **Atencao:** esta imagem NAO tem as skills do produto." >> $GITHUB_STEP_SUMMARY
            echo "> Configure o secret \`CATALOG_DEPLOY_KEY\` e rode de novo." >> $GITHUB_STEP_SUMMARY
          fi
